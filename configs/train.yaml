---
defaults:
 - _self_
 - data_info: DIV2K.yaml         # cifar10.yaml
 
#output_save_name: train_${task_name}_${data_info.data_name}_SNR${SNR_info}_rcpp${rcpp}_N${model_capacity}_seed${random_seed}_${model_name}
output_save_name: train_${model_name}_${data_info.data_name}_${chan_type}_rcpp${rcpp}_${performance_metric}
hydra:
  run:
    dir: logs/${output_save_name} #${now:%Y-%m-%d_%H-%M-%S}
    
chan_type: 'Rayleigh' #'AWGN', 'Rayleigh', 'Rayleigh-Estimated', 'none'
performance_metric: 'PSNR' #'PSNR', 'SSIM'
model_name: "ConvJSCC"
task_name: None
loss_name: 0 # MSE, CE, MSE_CE
optimizer_name: "Adam"
#model_capacity: 32
rcpp: 12
random_seed: 0 #random_seed_list = [0,10,20,30,40]
train_epoch: 1 #500, 1000, 2000, 10000
total_max_epoch: 500  #500, 200
learning_rate: 0.0001 # 0.001, 0.0001
step_num: 2
input_resolution: 0
ratio: 0.5
gamma: 0.5
beta: 0.02
alpha: 1.0
ratio1: 0.5
ratio2: 0.5
local_rank: None
use_ddp: None
data_mode: "train"
train_data: False
test_data: False
visual_data: False
data_dir: /media/biiteam/4T_Storage/WMY/dataset//
device: "cuda:2"
save_dir: /media/biiteam/4T_Storage/WMY/ST-JSCC/saved_models/
loss_curve_dir: /media/biiteam/4T_Storage/WMY/ST-JSCC/loss_curve/
SNR_info_list:
  - 1
  - 4
  - 7
  - 10
