---
defaults:
 - _self_
 - data_info: DIV2K.yaml         # cifar10.yaml

#output_save_name: model_evaluation
output_save_name: eval_${data_info.data_name}_${chan_type}_${performance_metric} 
hydra:
  run:
    dir: outputs/${output_save_name} #${now:%Y-%m-%d_%H-%M-%S}

chan_type: 'Rayleigh' #'AWGN', 'Rayleigh', 'Rayleigh-Estimated', 'none'
performance_metric: 'PSNR' #'PSNR', 'SSIM', 'MS-SSIM'
model_name: "STJSCC"
loss_name: 0
task_name: "ITrandomSNR"
input_resolution:
 - 128
 - 128
data_mode: test
#model_capacity: 32
rcpp: 12
random_seed: 0 #random_seed_list = [0,10,20,30,40]
ratio: 0.5
gamma: 0.5
ratio1: 0.5
ratio2: 0.5
test_data: "Kodak"  # DIV2K, Kodak, Set14, Set5
device: "cuda:0"
save_dir: /media/biiteam/4T_Storage/WMY/ST-JSCC/saved_models/
data_dir: /media/biiteam/4T_Storage/WMY/dataset/
result_dicts_dir: /media/biiteam/4T_Storage/WMY/ST-JSCC/result_dicts/
visual_data: False
visual_data_snr: 1
beta: 0.01
visual_results_dir: /media/biiteam/4T_Storage/WMY/ST-JSCC/visualization/
SNR_info_list:
  - 1
  - 4
  - 7
  - 10

